name: Red Main Incident

on:
  workflow_run:
    workflows: [Test, Journey Gate]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  stop-the-line:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the red-main incident
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          title="STOP: required main check is red"
          issue="$(gh issue list --state open --search \"$title in:title\" --json number --jq '.[0].number // empty')"
          body="Required workflow **$WORKFLOW_NAME** failed on main at \`$HEAD_SHA\`: $RUN_URL. This incident owns stabilization work until required main checks are green."
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
