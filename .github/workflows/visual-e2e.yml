name: Visual E2E

on:
  workflow_dispatch:

jobs:
  visual-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run visual regression specs
        run: npm run test:e2e:visual

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          {
            echo '### visual-e2e job (informational — does not block merge)'
            echo '- `npm run test:e2e:visual`'
            echo ''
            echo 'Update baselines locally: `npm run test:e2e:visual:update`'
          } >> "$GITHUB_STEP_SUMMARY"
