name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Enforce ESLint ratchet (changed files)
        run: npm run check:eslint-ratchet
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Enforce E2E companion updates (UI trigger paths)
        run: npm run check:e2e-companion
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Check formatting
        run: npm run format:check

      - name: Job summary
        if: always()
        run: |
          {
            echo '### lint-format job'
            echo '- `npm run lint`'
            echo '- `npm run check:eslint-ratchet`'
            echo '- `npm run check:e2e-companion`'
            echo '- `npm run format:check`'
            echo ''
            echo 'Fix locally: `npm run ci:lint` — see `docs/playbooks/pre_pr_verification.md`'
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck:all

      - name: Job summary
        if: always()
        run: |
          {
            echo '### typecheck job'
            echo '- `npm run typecheck:all` (app + test fixtures + MCP)'
            echo ''
            echo 'Common fix: use `makeVariable()` in tests — see pre-PR playbook fixture table'
          } >> "$GITHUB_STEP_SUMMARY"

  arch-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Enforce worker boundary
        run: npm run check:worker-boundary

      - name: Enforce queryBuilder purity
        run: npm run check:querybuilder-pure

      - name: Enforce design token policy
        run: npm run check:design-tokens

  unit-coverage:
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm run test:run -- --coverage

      - name: Run parity tests (WASM vs Node adapter)
        run: npm run test:parity

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          {
            echo '### unit-coverage job'
            echo '- `npm run test:run -- --coverage`'
            echo '- `npm run test:parity`'
            echo ''
            echo 'Download the **coverage-report** artifact for HTML details on failure.'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    needs: [unit-coverage]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-format, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E (product gates)
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          {
            echo '### e2e job'
            echo '- `npm run test:e2e` (excludes `@visual` screenshot specs)'
            echo ''
            echo 'Visual baselines: `npm run test:e2e:visual` (separate workflow, non-blocking)'
            echo 'Fix locally: `npm run ci:e2e` after `npx playwright install --with-deps`'
          } >> "$GITHUB_STEP_SUMMARY"
