name: Mutation

on:
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run core mutation tests
        run: npm run test:mutation:ci
        timeout-minutes: 90

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          {
            echo '### mutation job'
            echo '- `npm run test:mutation:ci` (Stryker break threshold: 48%)'
            echo ''
            echo 'Manual deep run. The stable required mutation job lives in `Test`.'
            echo 'Download **mutation-report** artifact for HTML details on failure.'
          } >> "$GITHUB_STEP_SUMMARY"
