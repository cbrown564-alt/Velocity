name: Mutation

on:
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run full core mutation tests
        env:
          MUTATION_FULL: '1'
          MUTATION_CONCURRENCY: '2'
        run: npm run test:mutation:full
        timeout-minutes: 90

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          {
            echo '### mutation job'
            echo '- `npm run test:mutation:full` (Stryker break threshold: 40%)'
            echo ''
            echo 'Manual deep run of the full gated `src/core/` mutate set.'
            echo 'PR `Test` mutation job is diff-scoped by default; use this workflow for a full campaign.'
            echo 'Download **mutation-report** artifact for HTML details on failure.'
          } >> "$GITHUB_STEP_SUMMARY"
