name: Journey Gate

on:
  workflow_dispatch:

jobs:
  journey-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Plan 06 journey gate
        run: node scripts/plan-06-journey-gate.mjs
        env:
          JOURNEY_BUDGET_COLD_MS: 10000
          JOURNEY_BUDGET_WARM_MS: 5000
          JOURNEY_BUDGET_EXPORT_MS: 5000
          JOURNEY_BUDGET_WAVE_REFRESH_MS: 30000

      - name: Run production boot and upload contract
        run: npm run test:e2e:production

      - name: Upload journey gate artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-gate-report
          path: |
            docs/assets/design-reset-evidence/
            playwright-report/
            test-results/
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo '### journey-gate job (plan_06 Phase 0 — WP0.2)'
            echo '- `node scripts/plan-06-journey-gate.mjs`'
            echo '- Budgets: cold crosstab <10s, warm crosstab <5s, export <5s, wave refresh <30s'
            echo ''
            echo 'Tune locally with `JOURNEY_BUDGET_*` env vars if needed.'
          } >> "$GITHUB_STEP_SUMMARY"
