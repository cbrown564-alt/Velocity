    const detail = () =&gt; `${state.corrected?&#x27;&lt;p class=&quot;v-tiny&quot;&gt;The table below preserves the original sample-mix check. The corrected W4 target changes the weighted estimate to 28%.&lt;/p&gt;&#x27;:&#x27;&#x27;}&lt;div class=&quot;v-note&quot;&gt;&lt;div class=&quot;v-label&quot;&gt;The alternative explanation&lt;/div&gt;&lt;p&gt;The higher-preference group grew from 20% to 50% of the sample. Preference within each group stayed at 20% and 40%. At a fixed 30% population share for the higher-preference group, both waves give 26%.&lt;/p&gt;&lt;/div&gt;&lt;table&gt;&lt;caption class=&quot;v-tiny&quot;&gt;Observed counts and rates · all respondents&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Group&lt;/th&gt;&lt;th&gt;W3 n&lt;/th&gt;&lt;th&gt;W4 n&lt;/th&gt;&lt;th&gt;Preference&lt;br&gt;W3 / W4&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Lower preference&lt;/td&gt;&lt;td&gt;960&lt;/td&gt;&lt;td&gt;600&lt;/td&gt;&lt;td&gt;20% / 20%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Higher preference&lt;/td&gt;&lt;td&gt;240&lt;/td&gt;&lt;td&gt;600&lt;/td&gt;&lt;td&gt;40% / 40%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;1,200&lt;/td&gt;&lt;td&gt;1,200&lt;/td&gt;&lt;td&gt;24% / 30%&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;v-tiny&quot;&gt;Illustrative two-group post-stratification. These checks explain the arithmetic; they do not establish a causal effect or statistical equivalence.&lt;/p&gt;`;
    function notify(message) { root.querySelector(&#x27;#v-state&#x27;).textContent=message; }
    function render() {
      root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.view===state.view)));
      root.querySelectorAll(&#x27;[data-question]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.question===state.question)));
      root.querySelector(&#x27;#v-answer-count&#x27;).textContent=state.kept?&#x27;1&#x27;:&#x27;0&#x27;;
      root.querySelector(&#x27;#v-question-status&#x27;).textContent=state.stale?&#x27;Evidence changed · revisit&#x27;:state.kept?&#x27;Kept in the answer&#x27;:state.parked?&#x27;Set aside for now&#x27;:state.checked?&#x27;Explanation inspected&#x27;:&#x27;An explanation to test&#x27;;
      if(state.view===&#x27;brief&#x27;) {
        main.innerHTML=`&lt;div class=&quot;v-label&quot;&gt;Start with the decision&lt;/div&gt;&lt;h2&gt;What would make us invest more in Meridian?&lt;/h2&gt;&lt;p class=&quot;v-sub&quot;&gt;The brief is a working set of questions. Each one keeps its evidence, alternative explanations, and your conclusion together.&lt;/p&gt;&lt;div class=&quot;v-question&quot;&gt;&lt;strong&gt;01 / Is the apparent growth present after weighting?&lt;/strong&gt;&lt;p class=&quot;v-tiny&quot;&gt;Available: preference, wave, group and analysis weights.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;v-question&quot;&gt;&lt;strong&gt;02 / Has trust improved?&lt;/strong&gt;&lt;p class=&quot;v-tiny&quot;&gt;Question wording changed. Compare definitions before comparing results.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;v-question&quot;&gt;&lt;strong&gt;03 / Does the evidence support more investment?&lt;/strong&gt;&lt;p class=&quot;v-tiny&quot;&gt;Survey evidence alone cannot establish incremental return on spend.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;v-note&quot;&gt;&lt;div class=&quot;v-label&quot;&gt;Preparation that affects this answer&lt;/div&gt;&lt;p&gt;Two waves loaded. Preference codes align. Both waves use population weighting. Trust needs a comparability decision.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;v-actions&quot;&gt;${action(&#x27;investigate&#x27;,&#x27;Investigate the apparent growth&#x27;,true)}&lt;/div&gt;`;
      } else if(state.view===&#x27;changes&#x27;) {
        main.innerHTML=`&lt;div class=&quot;v-label&quot;&gt;Review the consequences&lt;/div&gt;&lt;h2&gt;${state.corrected?&#x27;A changed estimate needs changed wording.&#x27;:&#x27;What changes when the data changes?&#x27;}&lt;/h2&gt;&lt;p class=&quot;v-sub&quot;&gt;A correction to the Wave 4 weight would change the answer you kept. Compare it before replacing the current evidence.&lt;/p&gt;${state.staged||state.corrected?`&lt;div class=&quot;v-diff&quot;&gt;&lt;div&gt;&lt;div class=&quot;v-label&quot;&gt;Current evidence · original&lt;/div&gt;&lt;strong&gt;26% → 26%&lt;/strong&gt;&lt;span class=&quot;v-tiny&quot;&gt;Fixed 30% higher-group target&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;v-label&quot;&gt;Corrected W4 weight&lt;/div&gt;&lt;strong&gt;26% → 28%&lt;/strong&gt;&lt;span class=&quot;v-tiny&quot;&gt;W4 higher-group target corrected to 40%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;v-step&quot;&gt;&lt;span&gt;Growth finding&lt;/span&gt;&lt;strong class=&quot;v-warning&quot;&gt;Revisit interpretation&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;v-step&quot;&gt;&lt;span&gt;Your wording and decision&lt;/span&gt;&lt;span&gt;Preserved for comparison&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;v-step&quot;&gt;&lt;span&gt;Trust wording issue&lt;/span&gt;&lt;span&gt;Unaffected&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;v-tiny&quot;&gt;This is a correction to the illustrative weight specification, not evidence of individual change. The correction itself needs a defensible external basis.&lt;/p&gt;&lt;div class=&quot;v-actions&quot;&gt;${state.corrected?action(&#x27;investigate&#x27;,&#x27;Revisit the finding&#x27;,true):action(&#x27;apply&#x27;,&#x27;Use corrected evidence&#x27;,true)+action(&#x27;cancel-stage&#x27;,&#x27;Keep original evidence&#x27;)}&lt;/div&gt;`:`&lt;div class=&quot;v-note&quot;&gt;&lt;div class=&quot;v-label&quot;&gt;A realistic interruption&lt;/div&gt;&lt;p&gt;The data provider corrects the population target for Wave 4. The chart can update automatically; your interpretation needs your attention.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;v-actions&quot;&gt;${action(&#x27;stage&#x27;,&#x27;Preview a weight correction&#x27;,true)}&lt;/div&gt;`}`;
      } else if(state.view===&#x27;answer&#x27;) {
        main.innerHTML=`&lt;div class=&quot;v-doc&quot;&gt;&lt;div class=&quot;v-doc-head&quot;&gt;&lt;div class=&quot;v-label&quot;&gt;Working answer / Brand review&lt;/div&gt;&lt;h2&gt;What we can say.&lt;br&gt;What remains open.&lt;/h2&gt;&lt;/div&gt;${state.kept?`&lt;div class=&quot;v-story-row&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;v-label ${state.stale?&#x27;v-warning&#x27;:&#x27;&#x27;}&quot;&gt;${state.stale?&#x27;Evidence changed · review before use&#x27;:&#x27;Your selected finding&#x27;}&lt;/div&gt;&lt;h3 style=&quot;margin-top:8px&quot;&gt;${esc(state.headline)}&lt;/h3&gt;&lt;p class=&quot;v-sub&quot;&gt;Unweighted preference: 24% → 30%. Weighted preference: 26% → ${state.corrected?28:26}%.&lt;/p&gt;${state.note?`&lt;p&gt;${esc(state.note)}&lt;/p&gt;`:&#x27;&#x27;}&lt;div class=&quot;v-actions&quot;&gt;${action(&#x27;investigate&#x27;,&#x27;Open its evidence&#x27;)}${action(&#x27;remove&#x27;,&#x27;Remove from answer&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`:`&lt;p class=&quot;v-sub&quot;&gt;No finding selected yet. Investigate the growth question, inspect the sample mix, then choose what belongs here.&lt;/p&gt;${action(&#x27;investigate&#x27;,&#x27;Return to the evidence&#x27;,true)}`}&lt;div class=&quot;v-story-row&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Trust remains unresolved.&lt;/h3&gt;&lt;p class=&quot;v-sub&quot;&gt;The question changed between waves. Keep this limitation beside the decision, rather than hiding it in an appendix.&lt;/p&gt;${action(&#x27;trust&#x27;,&#x27;Inspect wording&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;v-note&quot;&gt;&lt;div class=&quot;v-label&quot;&gt;Decision&lt;/div&gt;&lt;p&gt;More investment requires evidence beyond this headline movement. Commercial performance and campaign exposure are still needed.&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;v-tiny&quot;&gt;Concept preview: this is an editable working argument. Production export and durable project storage are not connected.&lt;/p&gt;&lt;/div&gt;`;
      } else if(state.question===&#x27;trust&#x27;) {
        main.innerHTML=`&lt;div class=&quot;v-label&quot;&gt;Question 02 / Comparability&lt;/div&gt;&lt;h2&gt;Trust changed.&lt;br&gt;So did the question.&lt;/h2&gt;&lt;p class=&quot;v-sub&quot;&gt;These items may measure different things. A shared variable name is not enough to establish a trend.&lt;/p&gt;&lt;div class=&quot;v-diff&quot;&gt;&lt;div&gt;&lt;div class=&quot;v-label&quot;&gt;Wave 3&lt;/div&gt;&lt;p&gt;“Meridian is a brand I trust.”&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;v-label&quot;&gt;Wave 4&lt;/div&gt;&lt;p&gt;“Meridian is reliable.”&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;v-note&quot;&gt;&lt;div class=&quot;v-label&quot;&gt;Research judgement&lt;/div&gt;&lt;p&gt;Keep the measures separate for now. A bridge study or agreed harmonisation rule would be needed to support a combined trend.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;v-actions&quot;&gt;${action(&#x27;mark-trust&#x27;,state.trustRecorded?&#x27;Recorded · keep separate&#x27;:&#x27;Record as not comparable&#x27;,true)}${action(&#x27;investigate&#x27;,&#x27;Back to growth&#x27;)}&lt;/div&gt;`;
      } else if(state.question===&#x27;action&#x27;) {
        main.innerHTML=`&lt;div class=&quot;v-label&quot;&gt;Question 03 / Decision&lt;/div&gt;&lt;h2&gt;A survey result is part of the investment case.&lt;/h2&gt;&lt;p class=&quot;v-sub&quot;&gt;We can describe the observed preference movement. We cannot infer the incremental return from additional spend from these two waves alone.&lt;/p&gt;&lt;div class=&quot;v-question&quot;&gt;&lt;strong&gt;What we can examine here&lt;/strong&gt;&lt;p&gt;Preference, sample composition and question comparability.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;v-question&quot;&gt;&lt;strong&gt;What is still missing&lt;/strong&gt;&lt;p&gt;Campaign exposure, commercial outcomes, costs and a credible counterfactual.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;v-actions&quot;&gt;${action(&#x27;answer&#x27;,&#x27;Read the working answer&#x27;,true)}&lt;/div&gt;`;
      } else {
        main.innerHTML=`&lt;div class=&quot;v-label&quot;&gt;Question 01 / Is Meridian growing?&lt;/div&gt;&lt;h2&gt;${state.corrected?&#x27;The correction changes the conclusion.&#x27;:&#x27;A six-point rise.&lt;br&gt;A different sample.&#x27;}&lt;/h2&gt;&lt;p class=&quot;v-sub&quot;&gt;${state.corrected?&#x27;Weighted preference is now two points higher. Your earlier wording remains available, but needs review.&#x27;:&#x27;The raw result suggests momentum. The weighted result suggests a different explanation worth testing.&#x27;}&lt;/p&gt;&lt;div class=&quot;v-context&quot;&gt;&lt;span&gt;Preference · all respondents&lt;/span&gt;&lt;span&gt;W3 → W4 · n = 1,200 each&lt;/span&gt;&lt;span&gt;${state.corrected?&#x27;Corrected W4 weight&#x27;:&#x27;Population weighting&#x27;}&lt;/span&gt;&lt;/div&gt;${chart()}${state.checked?detail():`&lt;div class=&quot;v-note&quot;&gt;&lt;div class=&quot;v-label&quot;&gt;One useful next question&lt;/div&gt;&lt;p&gt;Did preference change within groups, or did the mix of people answering change?&lt;/p&gt;&lt;/div&gt;`}${state.stale?`&lt;p class=&quot;v-warning&quot;&gt;Your selected finding needs review. The earlier wording has been preserved.&lt;/p&gt;`:&#x27;&#x27;}&lt;div class=&quot;v-actions&quot;&gt;${!state.checked?action(&#x27;check&#x27;,&#x27;Test the sample-mix explanation&#x27;,true):action(&#x27;keep&#x27;,state.kept&amp;&amp;!state.stale?&#x27;Update finding&#x27;:&#x27;Keep in the answer&#x27;,true)}${action(&#x27;edit&#x27;,&#x27;Write my interpretation&#x27;)}${action(&#x27;park&#x27;,state.parked?&#x27;Restore finding&#x27;:&#x27;Set aside&#x27;)}&lt;/div&gt;&lt;div class=&quot;v-edit&quot; id=&quot;v-editor&quot; hidden&gt;&lt;label class=&quot;v-tiny&quot; for=&quot;v-headline&quot;&gt;Finding headline&lt;/label&gt;&lt;textarea id=&quot;v-headline&quot;&gt;${esc(state.headline)}&lt;/textarea&gt;&lt;label class=&quot;v-tiny&quot; for=&quot;v-note-input&quot;&gt;Why it matters / limits&lt;/label&gt;&lt;textarea id=&quot;v-note-input&quot;&gt;${esc(state.note)}&lt;/textarea&gt;&lt;div class=&quot;v-actions&quot;&gt;${action(&#x27;save-edit&#x27;,&#x27;Save wording&#x27;,true)}${action(&#x27;cancel-edit&#x27;,&#x27;Cancel&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Source, calculation and scope&lt;/summary&gt;&lt;p class=&quot;v-tiny&quot;&gt;Illustrative fixture, not SBT benchmark data. W3: 192 + 96 preferrers / 1,200. W4: 120 + 240 / 1,200. Weighted rate: 20% × lower-group target + 40% × higher-group target. Original target 70/30; corrected W4 60/40. DK and missing responses are absent in this fixture. No significance test has been run.&lt;/p&gt;&lt;/details&gt;`;
      }
    }
    root.addEventListener(&#x27;click&#x27;,e=&gt;{
      const button=e.target.closest(&#x27;button&#x27;); if(!button)return;
      if(button.dataset.view){state.view=button.dataset.view;render();return;}
      if(button.dataset.question){state.question=button.dataset.question;state.view=&#x27;investigate&#x27;;render();return;}
      const a=button.dataset.action;
      if(!a)return;
      if(a===&#x27;reset&#x27;){state={view:&#x27;investigate&#x27;,question:&#x27;growth&#x27;,checked:false,kept:false,parked:false,corrected:false,staged:false,stale:false,edited:false,trustRecorded:false,headline:&#x27;The raw rise is explained by the sample mix in this example.&#x27;,note:&#x27;&#x27;};notify(&#x27;Example reset&#x27;);}
      if(a===&#x27;investigate&#x27;){state.view=&#x27;investigate&#x27;;state.question=&#x27;growth&#x27;;}
      if(a===&#x27;answer&#x27;)state.view=&#x27;answer&#x27;;
      if(a===&#x27;trust&#x27;){state.view=&#x27;investigate&#x27;;state.question=&#x27;trust&#x27;;}
      if(a===&#x27;check&#x27;){state.checked=true;notify(&#x27;Sample composition and within-group rates shown&#x27;);}
      if(a===&#x27;edit&#x27;){root.querySelector(&#x27;#v-editor&#x27;).hidden=false;root.querySelector(&#x27;#v-headline&#x27;).focus();return;}
      if(a===&#x27;cancel-edit&#x27;){root.querySelector(&#x27;#v-editor&#x27;).hidden=true;return;}
      if(a===&#x27;save-edit&#x27;){const text=root.querySelector(&#x27;#v-headline&#x27;).value.trim();if(!text){notify(&#x27;Add a headline before saving&#x27;);return;}state.headline=text;state.note=root.querySelector(&#x27;#v-note-input&#x27;).value;state.edited=true;notify(&#x27;Your wording is preserved in this preview&#x27;);}
      if(a===&#x27;keep&#x27;){if(state.corrected&amp;&amp;!state.edited){state.headline=&#x27;Weighted preference is two points higher after the correction.&#x27;;}state.kept=true;state.parked=false;state.stale=false;notify(&#x27;Finding kept · judgement remains yours&#x27;);state.view=&#x27;answer&#x27;;}
      if(a===&#x27;remove&#x27;){state.kept=false;notify(&#x27;Finding removed; evidence retained&#x27;);}
      if(a===&#x27;park&#x27;){state.parked=!state.parked;if(state.parked)state.kept=false;notify(state.parked?&#x27;Set aside; evidence remains available&#x27;:&#x27;Finding restored&#x27;);}
      if(a===&#x27;stage&#x27;){state.staged=true;notify(&#x27;Correction previewed; current evidence unchanged&#x27;);}
      if(a===&#x27;cancel-stage&#x27;){state.staged=false;notify(&#x27;Original evidence retained&#x27;);}
      if(a===&#x27;apply&#x27;){state.corrected=true;state.stale=state.kept;notify(&#x27;Corrected evidence applied; affected finding requires review&#x27;);}
      if(a===&#x27;mark-trust&#x27;){state.trustRecorded=true;notify(&#x27;Trust recorded as not comparable in this preview&#x27;);button.textContent=&#x27;Recorded · keep separate&#x27;;return;}
      render();
    });
    const signals={mix:{label:&#x27;Apparent movement&#x27;,title:&#x27;A rise that doesn’t survive weighting.&#x27;,text:&#x27;The unweighted estimate moves six points; the original weighted estimate is unchanged. Inspect composition before making this a growth story.&#x27;,detail:&#x27;W3 24% → W4 30% unweighted. W3 26% → W4 26% weighted.&#x27;,cta:&#x27;Set aside as a growth claim&#x27;},wording:{label:&#x27;Comparison interrupted&#x27;,title:&#x27;Resolve the meaning before the movement.&#x27;,text:&#x27;“A brand I trust” became “is reliable”. The change belongs in the researcher’s review queue before it belongs in a trend chart.&#x27;,detail:&#x27;W3: trust. W4: reliability. Numeric comparison withheld.&#x27;,cta:&#x27;Keep as separate measures&#x27;}};
    function renderSignal(key){const s=signals[key];root.querySelector(&#x27;#v-signal-detail&#x27;).innerHTML=`&lt;div class=&quot;v-label&quot;&gt;${s.label}&lt;/div&gt;&lt;h2&gt;${s.title}&lt;/h2&gt;&lt;p class=&quot;v-sub&quot;&gt;${s.text}&lt;/p&gt;&lt;div class=&quot;v-exhibit&quot;&gt;&lt;h3&gt;Evidence at a glance&lt;/h3&gt;&lt;p&gt;${s.detail}&lt;/p&gt;&lt;/div&gt;&lt;label class=&quot;v-tiny&quot; for=&quot;v-signal-note&quot;&gt;Researcher note&lt;/label&gt;&lt;textarea id=&quot;v-signal-note&quot; placeholder=&quot;Record what this changes for the brief…&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;v-actions&quot;&gt;&lt;button class=&quot;v-primary cursor-interaction&quot; id=&quot;v-signal-decide&quot;&gt;${s.cta}&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;v-tiny&quot; id=&quot;v-signal-state&quot; aria-live=&quot;polite&quot;&gt;No decision recorded&lt;/p&gt;`;root.querySelector(&#x27;#v-signal-decide&#x27;).onclick=()=&gt;{root.querySelector(&#x27;#v-signal-state&#x27;).textContent=&#x27;Decision recorded in this preview&#x27;+(root.querySelector(&#x27;#v-signal-note&#x27;).value?&#x27; · &#x27;+root.querySelector(&#x27;#v-signal-note&#x27;).value:&#x27;&#x27;);};}
    root.querySelectorAll(&#x27;[data-signal]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{root.querySelectorAll(&#x27;[data-signal]&#x27;).forEach(x=&gt;x.setAttribute(&#x27;aria-pressed&#x27;,String(x===b)));renderSignal(b.dataset.signal);});
    root.querySelector(&#x27;#v-document-edit&#x27;).onclick=()=&gt;{root.querySelector(&#x27;#v-document-editor&#x27;).hidden=false;root.querySelector(&#x27;#v-document-text&#x27;).focus();};
    root.querySelector(&#x27;#v-document-save&#x27;).onclick=()=&gt;{root.querySelector(&#x27;#v-document-conclusion&#x27;).textContent=root.querySelector(&#x27;#v-document-text&#x27;).value;root.querySelector(&#x27;#v-document-editor&#x27;).hidden=true;root.querySelector(&#x27;#v-document-state&#x27;).textContent=&#x27;Your wording kept in this preview&#x27;;};
    root.querySelectorAll(&#x27;[data-citation]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{root.querySelector(&#x27;#v-document-evidence&#x27;).innerHTML=b.dataset.citation===&#x27;numbers&#x27;?&#x27;&lt;div class=&quot;v-label&quot;&gt;Evidence 1 / Preference&lt;/div&gt;&lt;h3 style=&quot;margin-top:15px&quot;&gt;Same measure. Two views.&lt;/h3&gt;&lt;p&gt;Unweighted: 24% → 30%.&lt;br&gt;Weighted: 26% → 26%.&lt;/p&gt;&lt;p class=&quot;v-tiny&quot;&gt;All respondents. n = 1,200 each wave. Original 70/30 population targets. No significance inference.&lt;/p&gt;&#x27;:&#x27;&lt;div class=&quot;v-label&quot;&gt;Evidence 2 / Sample mix&lt;/div&gt;&lt;h3 style=&quot;margin-top:15px&quot;&gt;The higher-preference group grew.&lt;/h3&gt;&lt;p&gt;Sample share: 20% → 50%. Within-group preference remains 20% / 40%.&lt;/p&gt;&lt;p class=&quot;v-tiny&quot;&gt;Illustrative aggregate fixture. No individual-level change inferred.&lt;/p&gt;&#x27;;});
    render();renderSignal(&#x27;mix&#x27;);
  })();

    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
