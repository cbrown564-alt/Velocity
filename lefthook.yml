# Optional staged-file feedback. Keep hooks narrower than repository CI.
# Install: npx lefthook install
# Opt out for WIP commits: LEFTHOOK=0 git commit

pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,jsx,ts,tsx,json,css,scss,md,yml,yaml,html}'
      run: npx prettier --check {staged_files}
    lint:
      glob: '*.{js,jsx,ts,tsx}'
      run: npx eslint {staged_files}
