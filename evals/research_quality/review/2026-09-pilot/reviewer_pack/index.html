<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>
    Velocity · Research review
  </title>
  <style>
    :root {
      --bg-app: #f1efea;
      --bg-panel: #fdfcfa;
      --bg-panel-tint: #f7f5f0;
      --bg-rail: #ece9e3;
      --text-primary: #24302a;
      --text-secondary: #56635b;
      --border-color: #e3dfd7;
      --color-accent: #b54e33;
      --viz-fill-primary: #6f8177;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg-app);
      color: var(--text-primary);
      font:
        15px/1.6 system-ui,
        sans-serif;
    }
    header {
      padding: 28px 40px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: center;
    }
    h1 {
      font-size: 25px;
      letter-spacing: -0.8px;
      margin: 3px 0;
    }
    h2 {
      font-size: 22px;
      margin: 0 0 18px;
    }
    h3 {
      font-size: 16px;
    }
    p {
      margin: 8px 0 18px;
    }
    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--text-secondary);
    }
    main {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      max-width: 1500px;
      margin: auto;
      min-height: 90vh;
    }
    nav {
      padding: 28px 20px;
      position: sticky;
      top: 0;
      align-self: start;
    }
    nav button {
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }
    button,
    .file-label {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
      min-height: 44px;
    }
    button:hover,
    .file-label:hover {
      background: var(--bg-rail);
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--text-primary);
      outline-offset: 3px;
    }
    .primary {
      background: var(--color-accent);
      color: white;
      border-color: var(--color-accent);
    }
    button.primary:hover {
      filter: brightness(0.95);
      background: var(--color-accent);
    }
    button[aria-current='true'] {
      border-color: var(--text-primary);
      background: var(--bg-rail);
    }
    article {
      max-width: 1050px;
      padding: 32px 36px 100px;
      min-width: 0;
    }
    section,
    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 24px;
      margin: 0 0 20px;
    }
    .muted {
      color: var(--text-secondary);
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 550;
    }
    input,
    select,
    textarea {
      width: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 5px;
      padding: 10px;
    }
    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.6;
    }
    input[type='checkbox'] {
      width: auto;
      margin-right: 10px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--bg-panel-tint);
      padding: 14px;
      font-size: 12px;
      max-height: 460px;
      overflow: auto;
      font-variant-numeric: tabular-nums;
    }
    summary {
      cursor: pointer;
      padding: 8px 0;
    }
    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .row > * {
      flex: 1;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pill {
      background: var(--bg-rail);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      display: inline-block;
    }
    .evidence {
      padding: 5px 10px;
      font:
        12px ui-monospace,
        monospace;
      min-height: 34px;
      margin: 4px 4px 0 0;
    }
    #notice {
      padding: 12px 20px;
      background: var(--bg-panel);
      border-left: 4px solid var(--text-primary);
      margin: 0 0 20px;
      white-space: pre-wrap;
    }
    .hidden {
      display: none;
    }
    footer {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 24px 0;
    }
    dialog {
      width: min(950px, 90vw);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-panel);
      color: var(--text-primary);
      padding: 24px;
    }
    dialog::backdrop {
      background: #24302a66;
    }
    @media (max-width: 760px) {
      header {
        padding: 20px;
        display: block;
      }
      main {
        display: block;
      }
      nav {
        position: static;
        padding: 18px 20px;
        display: flex;
        gap: 10px;
        overflow: auto;
      }
      nav button {
        min-width: 180px;
      }
      article {
        padding: 8px 20px 60px;
      }
      .card,
      section {
        padding: 18px;
      }
      header .toolbar {
        margin-top: 15px;
      }
    }
  </style>
  <header>
    <div>
      <div class="eyebrow">Velocity / Research quality</div>
      <h1>Independent research review</h1>
      <div class="muted">Inspect the evidence. Make the editorial decisions.</div>
    </div>
    <div class="toolbar">
      <button id="save">Export progress</button
      ><label class="file-label" style="margin: 0; font-weight: 400"
        >Import review<input id="import" type="file" accept=".json" hidden
      /></label>
    </div>
  </header>
  <main>
    <nav aria-label="Studies" id="nav"></nav>
    <article id="content"></article>
  </main>
  <dialog id="evidence-dialog">
    <div class="row">
      <h2 id="evidence-title">Evidence</h2>
      <button id="close-dialog">Close</button>
    </div>
    <pre id="evidence-body"></pre>
  </dialog>

Wales / Northern Ireland.\n\n### S4 Meal-kit openness\n\nHow likely are you to consider using a meal-kit delivery service in the next 12 months?\n\n1 Definitely would not / 2 Probably would not / 3 Might or might not / 4 Probably would / 5 Definitely would.\n\n**Eligibility:** S4 >= 3.\n\n### P1\u2013P3 Food exploration orientation\n\nPlease indicate agreement from 1 Strongly disagree to 5 Strongly agree.\n\n- P1 I enjoy trying foods or flavours that are new to me.\n- P2 I often look for meals that feel different from my usual choices.\n- P3 I am willing to pay a little more for food that feels special or distinctive.\n\n**Derived pre-specified strategic subgroup:** `food_explorer = 1` when mean(P1:P3) >= 4.0. This definition is frozen before concept exposure.\n\n### P4 Current meal-kit usage\n\nNever used / Used previously / Use occasionally / Use regularly.\n\n## Randomisation\n\n### RAND Concept assignment\n\nRandomly assign approximately 1:1:1 to Flex / Plus / Simple. Assignment is independent of respondent characteristics before weighting.\n\n## Concept stimulus\n\n### Flex\n\n**Premium meals that fit around you.** Choose from a broad weekly menu, swap sides and proteins, skip or pause any week, and cook most meals in around 25 minutes. Designed to make a premium meal-kit subscription easy to keep using even when plans change.\n\n### Plus\n\n**Restaurant inspiration at home.** Explore chef-led weekly menus, more unusual flavours and ingredients, and stronger sourcing/provenance cues. Designed for people who want their meal kit to feel more like discovering something new than solving dinner routinely.\n\n### Simple\n\n**Premium dinner without the effort.** A focused menu of familiar dishes, fewer preparation steps and straightforward recipes using upgraded ingredients. Designed to make a premium meal feel dependable and easy on busy evenings.\n\n## Core evaluation\n\nAll questions refer to the assigned concept.\n\n### Q1 Overall appeal\n\nHow appealing is this concept to you?\n\n1 Not at all appealing / 2 / 3 / 4 / 5 Extremely appealing.\n\nVariable: `appeal_5`.\n\n### Q2 Purchase intent\n\nIf this service were available at a reasonable price, how likely would you be to subscribe or try it?\n\n1 Definitely would not / 2 Probably would not / 3 Might or might not / 4 Probably would / 5 Definitely would.\n\nVariable: `purchase_intent_5`.\n\n### Q3 Uniqueness\n\nHow different does this concept feel from meal-kit services you already know about?\n\n1 Not at all different / 2 / 3 / 4 / 5 Very different.\n\nVariable: `uniqueness_5`.\n\n### Q4 Relevance\n\nHow relevant does this concept feel to your needs?\n\n1 Not at all relevant / 2 / 3 / 4 / 5 Extremely relevant.\n\nVariable: `relevance_5`.\n\n### Q5 Credibility\n\nHow believable is it that a meal-kit provider could deliver this proposition consistently?\n\n1 Not at all believable / 2 / 3 / 4 / 5 Extremely believable.\n\nVariable: `credibility_5`.\n\n### Q6 Value for money\n\nAssuming a modest premium over a standard meal-kit subscription, how good or poor would you expect the value for money to be?\n\n1 Very poor / 2 / 3 / 4 / 5 Very good.\n\nVariable: `value_5`.\n\n### Q7 Ease of understanding\n\nHow easy is the concept to understand?\n\n1 Very difficult / 2 / 3 / 4 / 5 Very easy.\n\nVariable: `understanding_5`.\n\n### Q8 Premium value \u2014 routed\n\n**Ask only if Q7 >= 3.**\n\nThinking specifically about what makes this concept premium, how convincing is the premium proposition?\n\n1 Not at all convincing / 2 / 3 / 4 / 5 Extremely convincing.\n\nVariable: `premium_value_5`.\n\n**Universe:** respondents with `understanding_5 >= 3`. This must never be silently compared as though it has the unconditional Q1/Q2 denominator.\n\n## Likes / dislikes\n\n### Q9 What appeals?\n\nWhich aspects, if any, particularly appeal to you? Select all that apply.\n\n- Flexibility / ability to pause or swap\n- Ease / convenience\n- Broad menu choice\n- Familiar meals\n- New or unusual flavours\n- Chef-led inspiration\n- Ingredient quality\n- Provenance / sourcing\n- Premium feel\n- None of these\n\nVariables: `like_*` binary indicators.\n\n### Q10 What concerns you?\n\nWhich aspects, if any, concern you? Select all that apply.\n\n- Too expensive\n- Too complicated\n- Not different enough\n- Too unfamiliar / adventurous\n- Limited choice\n- Unclear benefit\n- Would not use often enough\n- None of these\n\nVariables: `dislike_*` binary indicators.\n\n## Analysis conventions\n\n- Primary concept summaries: weighted full 5-point distributions and top-2-box (4\u20135).\n- Bottom-2-box (1\u20132) is retained where polarisation/negative response matters.\n- Means are secondary descriptive summaries only.\n- Concept comparisons use the randomised monadic cells.\n- Pre-specified pairwise families use Holm-adjusted inference.\n- `food_explorer` is the only pre-specified strategic subgroup for confirmatory heterogeneity analysis.\n- Other demographic cuts are exploratory and cannot become mandatory headline findings solely because p \u003c .05.\n- Statistical significance and commercial materiality are separate fields; default commercial-materiality threshold is 5 percentage points for top-2-box differences.\n- Diagnostic associations with appeal/purchase intent are descriptive unless a separately specified model/assumption supports stronger language.\n", "evidence": {"project_id": "SBT-002", "weighting": "wt_final", "source_sha256": "26b1e05267701de7bcc2b3a81a71205b76492f1c6066460fa56d071e725e0525", "method": "Kish ESS Wald independent cells; Holm per metric across three pairs; two pre-specified Plus-minus-Flex interactions Holm-adjusted as one family", "concept_metrics": {"appeal_5": {"Flex": {"n_unweighted": 700, "n_weighted": 703.5199197275177, "n_eff": 650.1311942553228, "top2_pct": 60.962023118112626, "bottom2_pct": 16.396134737113677, "mean": 3.6953283828048122, "distribution_pct": {"1": 1.7771053129955576, "2": 14.619029424118118, "3": 22.641842144773697, "4" chase-intent difference does not establish equivalence. Purchase intent assumes a reasonable price and is not observed purchasing.", "topic_cluster": "advancement"}, {"model_finding_id": "F2", "proposition": "Develop Plus specifically for food explorers. Among explorers, Plus exceeds Flex numerically on appeal, 72.1% versus 60.1% (+12.0 pp), and purchase intent, 63.9% versus 52.4% (+11.5 pp). Among non-explorers, the direction reverses: appeal is 48.4% versus 61.2%, and purchase intent 46.2% versus 53.5%. The pre-specified interactions support this audience distinction: +24.8 pp for appeal (Holm p=0.0000137) and +18.8 pp for purchase intent (p=0.000968).", "evidence_refs": ["strategic_subgroup.food_explorer.appeal_5", "strategic_subgroup.food_explorer.purchase_intent_5", "strategic_subgroup.non_explorer.appeal_5", "strategic_subgroup.non_explorer.purchase_intent_5", "interactions.appeal_5", "interactions.purchase_intent_5"], "importance": "primary", "claim_strength": "Confirmatory evidence of heterogeneity; targeted advancement is a research recommendation.", "qualification": "Explorers were defined before exposure by mean food-orientation agreement >=4.0. Explorer bases: Flex n=236, effective n=225.4; Plus n=234, effective n=223.5. Non-explorer bases: Flex n=464, effective n=446.3; Plus n=466, effective n=449.1. Interaction tests establish differences between audience contrasts, not separately adjusted within-audience pairwise superiority. The definition includes willingness to pay more for distinctive food; actual payment was not tested.", "topic_cluster": "audience"}, {"model_finding_id": "F3", "proposition": "Preserve Plus's distinctiveness during development: uniqueness reaches 81.4% top-2-box, versus 47.9% for Flex and 34.3% for Simple. Plus's advantages are +33.5 pp over Flex (Holm p=5.20e-41) and +47.1 pp over Simple (p=2.65e-84), both commercially material.", "evidence_refs": ["concept_metrics.uniqueness_5", "pairwise.uniqueness_5[0]", "pairwise.uniqueness_5[2]"], "importance": "secondary", "claim_strength": "Statistically supported, commercially material diagnostic advantage.", "qualification": "Full assigned-cell bases, n=700 each. Uniqueness does not establish demand superiority or prove that distinctiveness causes appeal. The result supports retaining the proposition's differentiation, without identifying which individual feature produces it.", "topic_cluster": "differentiation"}, {"model_finding_id": "F4", "proposition": "Make comprehension and delivery credibility priorities before broader advancement of Plus. Only 32.3% rate Plus easy to understand, versus 95.7% for Flex; 32.1% rate Plus difficult and 35.6% choose the midpoint. Plus also trails Flex on relevance, 49.4% versus 63.7%, and credibility, 42.2% versus 62.3%. Flex's corresponding advantages are +63.5, +14.3 and +20.1 pp, all commercially material and Holm-significant.", "evidence_refs": ["concept_metrics.understanding_5", "concept_metrics.relevance_5", "concept_metrics.credibility_5", "pairwise.understanding_5[0]", "pairwise.relevance_5[0]", "pairwise.credibility_5[0]"], "importance": "primary", "claim_strength": "Strong comparative diagnostic evidence; improvement priorities are inferred.", "qualification": "Full assigned-cell bases, n=700 each. Holm p-values are 1.17e-219 for understanding, 3.23e-7 for relevance and 4.25e-13 for credibility. These measures do not prove that clearer communication would increase purchase intent; revise and retest rather than assume recovery.", "topic_cluster": "development_priorities"}, {"model_finding_id": "F5", "proposition": "Treat Plus's premium-conviction result as conditional evidence, not a whole-audience victory. Among respondents eligible for the routed question, 78.8% rate Plus's premium proposition convincing, versus 50.1% for Flex and 37.7% for Simple. However, only 69.0% of Plus respondents reached this question, compared with 99.1% for Flex and 99.7% for Simple.", "evidence_refs": ["concept_metrics.premium_value_5", "routing.premium_value_5", "pairwise.premium_value_5[0]", "pairwise.premium_value_5[2]"], "importance": "primary", "claim_strength": "Conditional descriptive advantage with supplied significant tests; unconditional superiority is not supported.", "qualification": "Universe is understanding_5 >=3, including midpoint respondents, not only those rating the concept easy. Valid unweighted bases/effective bases: Plus 483/444.4, Flex 694/644.6, Simple 698/643.4. Routing percentages are unweighted. Conditional Plus advantages are +28.7 pp over Flex (Holm p=5.08e-25) and +41.1 pp over Simple (p=5.14e-51), but conditioning on a post-exposure response selects different populations. Excluded respondents cannot be classified as rejecting the premium proposition.", "topic_cluster": "premium_evidence"}, {"model_finding_id": "F6", "proposition": "Do not interpret Plus's conditional premium conviction as superior value for money. On the full-cell value question, Plus scores 56.7% and Flex 56.3% top-2-box: a +0.3 pp numerical difference for Plus, with Holm p=0.900, below the 5 pp materiality threshold.", "evidence_refs": ["concept_metrics.value_5", "pairwise.value_5[0]"], "importance": "secondary", "claim_strength": "No statistically supported or commercially material value advantage is established.", "qualification": "Unweighted n=700 per concept. This question assumes a modest premium over a standard subscription; it does not estimate willingness to pay at a specified price. Nonsignificance does not prove equivalence.", "topic_cluster": "premium_evidence"}, {"model_finding_id": "F7", "proposition": "Deprioritise Simple in its current form. Appeal is 41.1%, below Flex by 19.9 pp and Plus by 12.9 pp; purchase intent is 40.4%, below Flex by 12.8 pp and Plus by 10.0 pp. All four gaps are commercially material and Holm-significant. Simple's strong understanding score, 92.9%, and credibility, 57.3%, have not translated into competitive primary outcomes.", "evidence_refs": ["concept_metrics.appeal_5", "concept_metrics.purchase_intent_5", "pairwise.appeal_5[1]", "pairwise.appeal_5[2]", "pairwise.purchase_intent_5[1]", "pairwise.purchase_intent_5[2]", "concept_metrics.understanding_5", "concept_metrics.credibility_5", "pairwise.understanding_5[1]", "pairwise.credibility_5[1]"], "importance": "primary", "claim_strength": "Deprioritisation recommendation supported by both primary outcomes.", "qualification": "Full assigned-cell bases, n=700 each. Appeal Holm p-values are 8.45e-13 versus Flex and 5.45e-6 versus Plus; purchase-intent p-values are 9.54e-6 and 0.000576. Flex's understanding advantage over Simple is significant but immaterial (+2.8 pp; p=0.0297); its credibility advantage is neither significant nor above the materiality threshold (+4.95 pp; p=0.0690). Results concern the tested proposition, not every possible familiar, convenient meal-kit offer.", "topic_cluster": "advancement"}], "story": {"beats": [{"order": 1, "finding_refs": ["F1", "F7"], "headline_intent": "Advance Flex broadly and deprioritise the current Simple concept, without claiming Flex wins purchase intent over Plus.", "analytical_relationship": "Primary outcomes establish the advancement shortlist and its uncertainty."}, {"order": 2, "finding_refs": ["F2"], "headline_intent": "Retain Plus for food explorers because the audience changes the relative response.", "analytical_relationship": "Pre-specified heterogeneity qualifies the overall recommendation."}, {"order": 3, "finding_refs": ["F3", "F4"], "headline_intent": "Preserve Plus's differentiation while improving comprehension and credibility.", "analytical_relationship": "Diagnostic strengths and weaknesses inform development priorities without establishing causal drivers."}, {"order": 4, "finding_refs": ["F5", "F6"], "headline_intent": "Keep premium conviction conditional and distinguish it from full-audience value perceptions.", "analytical_relationship": "Routing and question wording limit the commercial interpretation of apparent premium strength."}]}, "method_notes": ["Only the four supplied study materials were used. No tools, external sources or raw-data analyses were used; analysis_claims is therefore empty. Evidence references are exact paths within analysis_results.json, with zero-based array indices.", "This is a fictional, synthetic randomised monadic study of 2,100 UK adults aged 18\u201364 open to meal-kit use in the next 12 months, with 700 assigned to each concept. Findings are research-workflow conclusions, not market or customer evidence.", "Percentages use wt_final unless explicitly labelled unweighted. Full-cell weighted bases are Flex 703.52, Plus 696.32 and Simple 700.16; effective bases are 650.13, 645.63 and 645.23. Weighted bases are sums of weights, not respondent counts.", "Top-2-box means responses 4\u20135; bottom-2-box means 1\u20132. Full ordinal distributions remain available in the referenced concept tables; means were not used to determine advancement. Percentages and percentage-point differences are rounded independently.", "Inference follows the supplied Kish effective-sample-size Wald independent-cell analysis, with alpha=0.05 and Holm adjustment across three concept pairs within each metric. The two pre-specified Plus-minus-Flex interactions form a separate Holm-adjusted family. There is no stated correction across all metrics collectively.", "Statistical significance and commercial materiality are separate: the declared materiality threshold is 5 percentage points. Numerical leads and nonsignificant comparisons are not evidence of superiority or equivalence.", "Food explorer is the only pre-specified strategic subgroup. Exploratory demographic tables were not promoted to headline findings. Diagnostic associations were not interpreted causally.", "Advancement means further concept development and testing. These data do not establish actual uptake, price tolerance, delivery feasibility or a production-launch case."]}}, {"candidate_id": "  broad audience is eligible adults open to meal kits, not all UK adults.", "topic_cluster": "advancement"}, {"model_finding_id": "F2", "proposition": "Retain Plus for targeted development among food explorers, 23.83% of the weighted sample. Plus exceeds Flex within this segment on appeal (72.12% versus 60.10%; +12.02pp; Holm p=.00665) and intent (63.94% versus 52.40%; +11.54pp; p=.0259). Outside it, Flex leads on appeal (61.25% versus 48.42%; +12.83pp; p=.000200); its intent lead is inconclusive after correction (53.50% versus 46.23%; +7.27pp; p=.0587).", "evidence_refs": ["/analysis_claims/1/values/overall_explorer_weighted_pct", "/analysis_claims/1/values/explorers", "/analysis_claims/1/values/non_explorers", "/analysis_claims/1/values/interactions"], "importance": "primary", "claim_strength": "Pre-specified subgroup differences supported by direct interaction tests; targeting is a researcher recommendation.", "qualification": "Flex/Plus bases: 236/234 explorers and 464/466 non-explorers. Explorer advantages exceed 5pp as point estimates, but unadjusted CIs include smaller effects: appeal 3.34\u201320.69pp; intent 2.44\u201320.64pp. Non-explorer Flex advantages have CIs of 6.37\u201319.30pp and 0.73\u201313.80pp, respectively. Direct interaction differences are 24.85pp for appeal (CI 14.03\u201335.67; Holm p=.0000203) and 18.81pp for intent (7.60\u201330.02; p=.00301). Segment share is not an addressable-market estimate.", "topic_cluster": "targeting"}, {"model_finding_id": "F3", "proposition": "Deprioritize Simple in its current form. Its appeal is 41.08% and intent 40.41%; Flex exceeds it by 19.88pp and 12.81pp, and Plus by 12.93pp and 10.00pp. All four comparisons pass Holm correction (p\u2264.000576). Easy understanding (92.92%) is insufficient to establish competitive primary outcomes.", "evidence_refs": ["/analysis_claims/0/values/appeal_5", "/analysis_claims/0/values/purchase_intent_5", "/analysis_claims/0/values/understanding_5", "/analysis_claims/3/values/selected_pct"], "importance": "primary", "claim_strength": "Supported disadvantages on both primary outcomes; relative development recommendation.", "qualification": "n=700 per concept. All four point differences exceed 5pp. Unadjusted CIs are 14.55\u201325.21pp and 7.42\u201318.20pp for Flex's appeal and intent advantages, and 7.52\u201318.34pp and 4.59\u201315.40pp for Plus's; the last includes effects below 5pp. Simple's insufficient-differentiation (40.74%) and limited-choice (35.44%) concerns are descriptive development clues, not demonstrated causes. No absolute advancement hurdle was supplied.", "topic_cluster": "simple_decision"}, {"model_finding_id": "F4", "proposition": "For Plus, test clearer communication and stronger support for delivery credibility while preserving differentiation. Plus exceeds Flex on uniqueness (81.39% versus 47.91%), but trails on easy understanding (32.25% versus 95.71%) and credibility (42.15% versus 62.25%). All three differences survive Holm correction. Complexity (40.87%) and adventurousness (40.66%) are prominent reported concerns.", "evidence_refs": ["/analysis_claims/0/values/uniqueness_5", "/analysis_claims/0/values/understanding_5", "/analysis_claims/0/values/credibility_5", "/analysis_claims/3/values/selected_pct"], "importance": "primary", "claim_strength": "Supported rating differences; descriptive development clues and an untested improvement recommendation.", "qualification": "n=700 per concept. Plus's uniqueness advantage is 33.48pp (unadjusted CI 28.58\u201338.39); Flex's understanding and credibility advantages are 63.46pp (59.57\u201367.35) and 20.10pp (14.79\u201325.41). All exceed 5pp, with Holm p\u003c.000001. Plus receives difficult-understanding ratings from 32.15%. Likes for new flavours (62.48%), chef inspiration (53.88%) and provenance (48.22%) suggest content to preserve. These results do not establish causes of intent, actual delivery performance, or redesign effects.", "topic_cluster": "plus_development"}, {"model_finding_id": "F5", "proposition": "Do not interpret Plus's 78.82% premium-conviction score as an overall premium advantage. The question reached only 67.85% of its weighted assigned cell, versus 99.10% for Flex and 99.75% for Simple; their conditional scores were 50.09% and 37.73%.", "evidence_refs": ["/analysis_claims/2/values/eligible_unweighted_n", "/analysis_claims/2/values/eligible_weighted_pct_of_assigned_cell", "/analysis_claims/2/values/premium_value_5"], "importance": "primary", "claim_strength": "Descriptive conditional result with a consequential denominator limitation.", "qualification": "Routed bases: Plus 483, Flex 694, Simple 698. Eligibility requires post-exposure understanding >=3, so these selected groups do not preserve an unconditional randomized comparison. Unasked responses are unknown, not negative. No overall premium superiority or inferential comparison is established.", "topic_cluster": "premium_evidence"}, {"model_finding_id": "F6", "proposition": "Test concrete prices before commercial commitment. Flex and Plus have numerically similar expected-value scores (56.33% and 56.68%; Flex\u2013Plus \u22120.35pp; Holm p=.900), while 32.39% and 38.80%, respectively, select expense concerns.", "evidence_refs": ["/analysis_claims/0/values/value_5", "/analysis_claims/3/values/selected_pct/dislike_expensive"], "importance": "secondary", "claim_strength": "Pricing research recommendation; neither a value advantage nor equivalence is established.", "qualification": "n=700 per concept. The value-difference unadjusted CI is \u22125.76\u20135.07pp; its point estimate is below the 5pp materiality threshold. Intent assumes a 'reasonable price' and value an unspecified 'modest premium'; neither measures conversion at a concrete price. Expense selections were not significance-tested.", "topic_cluster": "commercial_qualification"}], "story": {"beats": [{"order": 1, "finding_refs": ["F1", "F3"], "headline_intent": "Prioritize Flex for broad development and deprioritize current Simple", "analytical_relationship": "Establish relative development priorities from primary outcomes, distinguishing Flex's supported appeal advantage from its unresolved overall intent comparison with Plus."}, {"order": 2, "finding_refs": ["F2"], "headline_intent": "Retain Plus for food explorers", "analytical_relationship": "Qualify the overall recommendation with the pre-specified audience in which Plus leads Flex, supported by direct evidence of heterogeneity on both primary outcomes."}, {"order": 3, "finding_refs": ["F4", "F5"], "headline_intent": "Improve Plus's clarity and credibility without overstating its premium evidence", "analytical_relationship": "Connect supported rating differences and descriptive concerns to development priorities, then explain why understanding-based routing limits the apparent premium advantage."}, {"order": 4, "finding_refs": ["F6"], "headline_intent": "Resolve price-specific demand before commercial commitment", "analytical_relationship": "Close with the commercial evidence gap left by hypothetical pricing and reported expense concerns."}]}, "method_notes": ["This synthesis uses the supplied questionnaire, codebook, study materials and prior-stage numerical output. Respondent-level calculations and the prior stage's data-quality checks were not independently rerun; numerical estimates and inference are inherited.", "The study is fictional: a randomized monadic comparison of three concepts among 2,100 eligible UK adults aged 18\u201364, with 700 assigned per concept. Recommendations concern relative development within this study and do not validate real market demand.", "Percentages use supplied wt_final and valid question-specific bases. Bases are unweighted unless stated otherwise. Arrays follow Flex, Plus, Simple; ordinal distributions retain scores 1 through 5. Top-two-box means scores 4\u20135 and bottom-two-box means 1\u20132. Rounding can produce small discrepancies.", "The declared policy requires Holm correction within concept-comparison families but does not enumerate their exact membership. The inherited implementation uses all three pairwise comparisons within each outcome, separately overall and within each explorer-status group; each primary outcome's three pairwise concept-by-explorer interactions form a separate family. No across-outcome correction is applied. Significance claims are conditional on this implementation, whose family membership is not documented as pre-specified.", "Inherited inference uses independent-cell normal Wald tests with fixed-weight robust proportion variance n/(n\u22121) \u00d7 sum[w_i\u00b2(y_i\u2212p)\u00b2]/sum(w_i)\u00b2, where y indicates scores 4\u20135. Difference variances add across independent cells; interaction variances add across four disjoint cells. Calibration-estimation uncertainty is not represented.", "All reported confidence intervals are unadjusted 95% intervals; significance decisions use Holm-adjusted p-values at .05. Commercial materiality is assessed separately as an absolute top-two-box point difference >=5pp. A material point estimate does not prove the true effect exceeds 5pp; non-significance does not prove equivalence.", "Food explorer, defined before exposure as mean(P1:P3) >=4, is the sole pre-specified strategic subgroup. Heterogeneity claims rely on direct interactions rather than differences in subgroup significance levels.", "Premium ratings describe only respondents with understanding >=3. Multiple-response diagnostics are descriptive, can sum above 100%, and do not establish causal drivers.", "Evidence references are exact JSON Pointer paths to analysis tables within this response. Stable analysis_id fields identify the analyses; every story finding reference resolves."]}}, {"candidate_id": "SBT-002-05", "output": {"study_id": "SBT-002", "analysis_claims": [{"analysis_id": "overall_primary", "values": {"concept_order": ["Flex", "Plus", "Simple"], "unweighted_n": [700, 700, 700], "weig  and delivery credibility need attention. Uniqueness reaches 81.4%, versus Flex's 47.9% (Plus advantage 33.5 points; Holm p=5.20e-41). Conversely, Flex leads Plus on relevance, 63.7% versus 49.4% (14.3 points; p=3.23e-7), and credibility, 62.3% versus 42.2% (20.1 points; p=4.25e-13).", "evidence_refs": ["concept_metrics.uniqueness_5", "concept_metrics.relevance_5", "concept_metrics.credibility_5", "pairwise.uniqueness_5", "pairwise.relevance_5", "pairwise.credibility_5"], "importance": "secondary", "claim_strength": "Statistically established and commercially material diagnostic differences", "qualification": "Unweighted n=700 per concept. These ratings suggest development priorities; they do not prove that changing relevance or credibility will increase purchase intent.", "topic_cluster": "development"}, {"model_finding_id": "F5", "proposition": "Clarifying Plus should precede broader advancement. Only 32.3% rate it easy to understand, versus 95.7% for Flex and 92.9% for Simple; both gaps exceed 60 points and are Holm-significant (p=1.17e-219 and 1.73e-183). Plus's full understanding distribution is 7.9%, 24.2%, 35.6%, 23.9%, and 8.4% across scores 1\u20135: difficulty and neutrality are substantial, not just a shortage of the highest rating.", "evidence_refs": ["concept_metrics.understanding_5", "pairwise.understanding_5"], "importance": "primary", "claim_strength": "Confirmatory comprehension deficit; clarification and retesting recommended", "qualification": "Unweighted n=700 per concept. Understanding is self-reported. Flex's 2.8-point advantage over Simple is statistically significant (p=0.0297) but below the commercial-materiality threshold. The effect of clearer wording remains untested.", "topic_cluster": "development"}, {"model_finding_id": "F6", "proposition": "Treat Plus's strong premium-conviction result as conditional evidence. Among respondents eligible for the routed question, 78.8% rate Plus positively, versus 50.1% for Flex and 37.7% for Simple. Ho -kit use in the next 12 months, with 700 assigned to each concept. Findings are fictional study conclusions, not market or customer claims.", "Percentages use wt_final; bases labelled n are unweighted respondent counts. Full-cell weighted bases are Flex 703.52, Plus 696.32 and Simple 700.16; corresponding Kish effective bases are 650.13, 645.63 and 645.23.", "Top-two means scores 4\u20135 and bottom-two means scores 1\u20132. Ordinal distributions are retained where they materially qualify interpretation; means are not used to rank concepts. Percentages and differences are rounded from supplied unrounded results.", "Inference follows the supplied Kish-effective-sample-size Wald method for independent cells, with Holm correction across three concept pairs within each metric at alpha=0.05. The two pre-specified Plus-minus-Flex interactions form a separate Holm-adjusted family. Correction is not across all metrics.", "Statistical significance and commercial materiality are separate: the declared threshold is 5 percentage points. A numerical lead alone does not prove superiority, and a non-significant difference does not demonstrate equivalence.", "Food explorer is the only pre-specified confirmatory subgroup. Exploratory demographic cuts are not used for advancement headlines. No supplied diagnostic correlation is interpreted causally.", "Purchase intent assumes a reasonable price and measures stated likelihood to subscribe or try, not actual conversion. Further concept testing can assess the recommended revisions; this study does not establish pricing, demand or launch readiness."]}}, {"candidate_id": "SBT-002-08", "output": {"study_id": "SBT-002", "analysis_claims": [], "findings": [{"model_finding_id": "F1", "proposition": "Advance Flex for broad-audience development within the eligible study audience. Weighted top-two appeal is 61.0% versus 54.0% for Plus, a 7.0-point advantage (Holm p=0.0112) exceeding the 5-point commercial threshold. Purchase intent is 53.2% versus 50.4%; this 2.8-point numerical lead does not demonstrate superiority (Holm p=0.311).", "evidence_refs": ["concept_metrics.appeal_5.Flex", "concept_metrics.appeal_5.Plus", "pairwise.appeal_5[0]", "concept_metrics.purchase_intent_5.Flex", "concept_metrics.purchase_intent_5.Plus", "pairwise.purchase_intent_5[0]"], "importance": "primary", "claim_strength": "Development recommendation supported by significant appeal superiority and a commercially material point estimate; purchase-intent superiority is unproven.", "qualification": "Both cells have n=700; effective bases are Flex 650.1 and Plus 645.6. Nonsignificance does not establish equivalence. Purchase intent assumes a reasonable price and measures stated likelihood to subscribe or try, not observed demand. The appeal test establishes a difference from zero, not that the population difference exceeds 5 points.", "topic_cluster": "advancement"}, {"model_finding_id": "F6", "proposition": "Deprioritise Simple in its tested form. Appeal is 41.1%, below Flex by 19.9 points and Plus by 12.9; purchase intent is 40.4%, below Flex by 12.8 and Plus by 10.0. All four disadvantages exceed the 5-point commercial threshold and have Holm p\u003c0.001. Simple nevertheless achieves 92.9% top-two ease of understanding and 57.3% credibility.", "evidence_refs": ["concept_metrics.appeal_5.Simple", "concept_metrics.purchase_intent_5.Simple", "pairwise.appeal_5[1]", "pairwise.appeal_5[2]", "pairwise.purchase_intent_5[1]", "pairwise.purchase_intent_5[2]", "concept_metrics.understanding_5.Simple", "concept_metrics.credibility_5.Simple"], "importance": "primary", "claim_strength": "Significant disadvantages on both primary outcomes, with commercially material point estimates, support deprioritisation.", "qualification": "Each concept has n=700; Simple's effective base is 645.2. This recommendation concerns the tested stimulus, not all propositions based on simplicity. Understanding and credibility do not establish causal effects on appeal or intent.", "topic_cluster": "portfolio_priority"}, {"model_finding_id": "F2", "proposition": "Retain Plus for targeted development among food explorers. Explorer appeal is 72.1% for Plus versus 60.1% for Flex, and purchase intent is 63.9% versus 52.4%. Among non-explorers, the numerical pattern reverses: appeal is 48.4% versus 61.2%, and intent is 46.2% versus 53.5%. The pre-specified differences between these groups' Plus-minus-Flex gaps are 24.85 points for appeal (Holm p=0.0000137) and 18.81 points for intent (Holm p=0.000968).", "evidence_refs": ["strategic_subgroup.food_explorer.appeal_5", "strategic_subgroup.food_explorer.purchase_intent_5", "strategic_subgroup.non_explorer.appeal_5", "strategic_subgroup.non_explorer.purchase_intent_5", "interactions.appeal_5", "interactions.purchase_intent_5"], "importance": "primary", "claim_strength": "Confirmatory interaction evidence supports different relative performance by audience and targeted development.", "qualification": "Explorer bases: Plus n=234, effective n=223.5; Flex n=236, effective n=225.4. Non-explorer bases: Plus n=466, effective n=449.1; Flex n=464, effective n=446.3. Interaction tests do not establish adjusted superiority within either subgroup. Explorer status was defined before exposure as mean agreement across P1\u2013P3 >=4, including willingness to pay more for distinctive food.", "topic_cluster": "target_audience"}, {"model_finding_id": "F5", "proposition": "Treat Plus's premium-conviction advantage as conditional evidence. Among routed respondents, weighted top-two conviction is 78.8% for Plus, 50.1% for Flex and 37.7% for Simple. Plus's conditional advantages are 28.7 points over Flex (Holm p=5.08e-25) and 41.1 over Simple (Holm p=5.14e-51). Only 69.0% of Plus's assigned respondents qualified, versus 99.1% for Flex and 99.7% for Simple.", "evidence_refs": ["concept_metrics.premium_value_5", "pairwise.premium_value_5[0]", "pairwise.premium_value_5[2]", "routing.premium_value_5"], "importance": "primary", "claim_strength": "Significant conditional comparisons among differently selected populations; no unconditional premium-superiority claim.", "qualification": "Eligibility requires understanding_5 >=3, including the midpoint. Eligible bases: Plus n=483, effective n=444.4; Flex n=694, effective n=644.6; Simple n=698, effective n=643.4. Routing rates are unweighted; outcomes use wt_final. Unequal post-exposure selection means randomisation does not ensure comparable routed populations. Excluded responses are neither failures nor zeros. Premium conviction is not willingness to pay.", "topic_cluster": "premium_evidence"}, {"model_finding_id": "F3", "proposition": "Test clearer communication and a more believable, relevant proposition for Plus. Flex exceeds Plus on ease of understanding (95.7% versus 32.3%; +63.5 points), credibility (62.3% versus 42.2%; +20.1), and relevance (63.7% versus 49.4%; +14.3); all Holm p\u003c0.000001. Expected value for money shows no demonstrated difference: 56.3% for Flex versus 56.7% for Plus (Holm p=0.900).", "evidence_refs": ["concept_metrics.understanding_5", "pairwise.understanding_5[0]", "concept_metrics.credibility_5", "pairwise.credibility_5[0]", "concept_metrics.relevance_5", "pairwise.relevance_5[0]", "concept_metrics.value_5", "pairwise.value_5[0]"], "importance": "secondary", "claim_strength": "Significant diagnostic differences identify development hypotheses, not proven improvements.", "qualification": "Weighted top-two scores; n=700 per concept, with effective bases Flex 650.1 and Plus 645.6. These comparisons do not establish that changing the diagnostics would improve appeal or intent. Expected value assumes a modest premium and does not measure willingness to pay a specific price. Nonsignificance does not establish equivalence.", "topic_cluster": "development_priorities"}, {"model_finding_id": "F4", "proposition": "Preserve Plus's distinctiveness while addressing its mixed reception. Uniqueness is 81.4%, versu  "bottom2_pct": 35.68606789054786, "mean": 3.031289574604888, "distribution_pct": {"1": 13.843447172234194, "2": 21.842620718313665, "3": 26.641573668557502, "4": 22.68624435851845, "5": 14.986114082376192}, "se_prop": 0.026089867968501535}}, "1": {"nps": {"nps": -54.76705697428123, "promoter_pct": 8.131973845370245, "passive_pct": 28.96899533497828, "detractor_pct": 62.89903081965148, "n": 11, "n_weighted": 11.491534135039132, "n_eff": 10.548761772033238}, "renewal": {"n_unweighted": 11, "n_weighted": 11.491534135039132, "n_eff": 10.548761772033238, "top2_pct": 28.31552087861622, "bottom2_pct": 21.2947505908122, "mean": 3.1336914930662374, "distribution_pct": {"1": 14.97166393186497, "2": 6.323086658947228, "3": 50.38972853057159, "4": 6.9954779279314785, "5": 21.320042950684737}, "se_prop": 0.1387152159194343}}}}}}, "candidates": [{"candidate_id": "SBT-003-01", "output": {"study_id": "SBT-003", "analysis_claims": [], "findings": [{"model_finding_id": "F1", "proposition": "Prioritise a company-wide customer experience response: weighted NPS is \u221254.7, comprising 11.6% promoters, 22.1% passives and 66.3% detractors. Satisfaction is 34.6% top-two-box versus 42.0% bottom-two-box; renewal intent is 33.4% versus 40.8%.", "evidence_refs": ["analysis_results.json.company", "analysis_results.json.satisfaction", "analysis_results.json.renewal"], "importance": "primary", "claim_strength": "Descriptive evidence of widespread weak outcomes", "qualification": "Each outcome has unweighted n=2,400 and effective n=2,232.6. Renewal measures stated intent, not observed churn. These outcomes establish breadth but do not identify causes.", "topic_cluster": "company_wide_priority"}, {"model_finding_id": "F2", "proposition": "Make unsuccessful first-contact resolution a focused operational priority. The table-defined unresolved-contact group has NPS \u221287.4 and renewal top-two-box of 7.6%, compared with \u221252.6 and 33.8% among resolved contacts. Its severity is substantial, but its reach is limited: 8.5% of customers and 11.6% of company detractors.", "evidence_refs": ["analysis_results.json.groups.unresolved_contact", "analysis_results.json.groups.resolved_contact"], "importance": "primary", "claim_strength": "Large descriptive association; causal effect unestablished", "qualification": "Unresolved-contact n=323, effective n=316.0; resolved-contact n=359, effective n=351.5. No comparative significance tests are supplied. Resolution is measured at first contact, so failure does not establish that an issue remained unresolved. Differences may reflect issue severity or customer mix; they do not estimate the benefit of an intervention.", "topic_cluster": "support_resolution"}, {"model_finding_id": "F3", "proposition": "Review support quality alongside resolution. Among recent support contacts, 52.7% report first-contact resolution, while support quality is 34.8% top-two-box and 43.8% bottom-two-box. Even the resolved-contact group retains 65.6% detractors, indicating that resolution status alone does not distinguish a broadly positive customer experience.", "evidence_refs": ["analysis_results.json.support", "analysis_results.json.groups.resolved_contact.nps"], "importance": "secondary", "claim_strength": "Descriptive operational diagnostic", "qualification": "Support measures cover only customers contacting support in the past 90 days: n=682, weighted base=434.0, effective n=667.4. Resolved-contact n=359. These are overall recommendation outcomes, not a causal evaluation of support.", "topic_cluster": "support_quality"}, {"model_finding_id": "F4", "proposition": "Investigate legacy-plan experiences before targeting tenure alone. Customers with 6+ years of tenure have renewal top-two-box of 30.7%, versus 37.4% among customers with under one year, but legacy-plan prevalence is also much higher: 53.2% versus 3.0%. Among non-legacy customers, renewal top-two-box spans only 35.5%\u201337.7% across tenure bands and NPS spans \u221251.0 to \u221249.1.", "evidence_refs": ["analysis_results.json.tenure"], "importance": "primary", "claim_strength": "Stratified descriptive evidence consistent with customer-mix confounding", "qualification": "Overall tenure bases are n=380, 593, 763 and 664 for \u003c1y, 1\u20132y, 3\u20135y and 6+y; non-legacy bases are 369, 542, 563 and 303. This pattern weakens a tenure-only explanation but does not isolate a legacy-plan effect. Numerical similarity is not evidence of statistical equivalence. The legacy \u003c1y cell, n=11, is suppressed from interpretation.", "topic_cluster": "legacy_and_tenure"}, {"model_finding_id": "F5", "proposition": "Include the table-defined legacy-contact group in targeted investigation: NPS is \u221278.5, renewal top-two-box is 14.4% and bottom-two-box is 67.6%. It represents 6.6% of customers and 8.4% of company detractors, making it a severe but relatively narrow problem area.", "evidence_refs": ["analysis_results.json.groups.legacy_contact"], "importance": "secondary", "claim_strength": "Descriptive targeting signal", "qualification": "Unweighted n=251; effective n=245.2. The table does not explicitly document this group's filter. Confirm its definition before operational targeting. It may overlap with unresolved contacts and long-tenure customers; shares must not be added. No causal effect or statistically distinct ranking is established.", "topic_cluster": "legacy_and_tenure"}, {"model_finding_id": "F6", "proposition": "Treat premium unresolved contacts as a monitoring subgroup rather than a separate leading priority. NPS is \u221289.2 and renewal top-two-box is 7.4%, but the group represents only 1.3% of customers and 1.8% of company detractors.", "evidence_refs": ["analysis_results.json.groups.premium_unresolved", "analysis_results.json.groups.unresolved_contact"], "importance": "secondary", "claim_strength": "Small-base descriptive signal", "qualification": "Unweighted n=67, below the warning threshold of 75; effective n=66.7. The numerically worse NPS does not establish greater severity than unresolved contacts overall. The subgroup overlaps the broader resolution priority, and no revenue or customer-value evidence supports preferential treatment.", "topic_cluster": "priority_limits"}], "story": {"beats": [{"order": 1, "finding_refs": ["F1"], "headline_intent": "Establish the breadth of weak customer outcomes", "analytical_relationship": "Company-wide outcomes set the scale against which targeted priorities should be judged."}, {"order": 2, "finding_refs": ["F2", "F3"], "headline_intent": "Prioritise support resolution while examining the wider support experience", "analytical_relationship": "Resolution groups show a large descriptive contrast, but limited population reach and poor outcomes among resolved contacts constrain a support-only explanation."}, {"order": 3, "finding_refs": ["F4", "F5"], "headline_intent": "Investigate legacy-plan experiences before treating tenure as the problem", "analytical_relationship": "Stratification qualifies the aggregate tenure pattern; the legacy-contact group adds a focused investigation opportunity."}, {"order": 4, "finding_refs": ["F6", "F2", "F1"], "headline_intent": "Allocate attention using reach and uncertainty as well as severity", "analytical_relationship": "A small subgroup's extreme score should not displace the broader resolution priority or the company-wide response."}]}, "method_notes": ["Used only the supplied study content; no tools, external sources or respondent-level data were used. Evidence references identify supplied analysis tables; analysis_claims is empty because no raw-data analysis was performed.", "All reported estimates use wt_final. Bases labelled n are unweighted respondent counts; weighted totals and effective bases are distinguished where reported. Overall weighted base is 2,400.", "NPS is weighted promoter percentage (9\u201310) minus detractor percentage (0\u20136). Top-two-box denotes responses 4\u20135 and bottom-two-box response his is a published-data transfer check, not an unseen holdout or raw-preparation test."}, "questionnaire": "# Published question wording\n\n## Q2m\n\nQ2m. To what extent, if at all, are you worried about there not being enough food available for you/your household to buy in the next month?Please select one answer only\n\nBase: all respondents; weighted percentages.\n\nResponses: Very worried; Somewhat worried; Not very worried; Not at all worried; Don't know; Prefer not to answer; Net: Worried; Net: Not worried\n\n## Q3m\n\nQ3m. To what extent, if at all, are you worried you/your household will not be able to afford food in the next month?Please select one answer only\n\nBase: all respondents; weighted percentages.\n\nResponses: Very worried; Somewhat worried; Not very worried; Not at all worried; Don't know; Prefer not to answer; Net: Worried; Net: Not worried\n\n## Q12_8\n\nQ12_8. Food prices\n\nBase: all respondents; weighted percentages.\n\nResponses: Highly concerned; Somewhat concerned; Not very concerned; Not concerned at all; Don't know; I don't know enough to comment; Net: Concerned; Net: Unconcerned\n\n## Q12_14\n\nQ12_14. Ultra-processed, or over-processing of food\n\nBase: all respondents; weighted percentages.\n\nResponses: Highly concerned; Somewhat concerned; Not very concerned; Not concerned at all; Don't know; I don't know enough to comment; Net: Concerned; Net: Unconcerned\n\n## Q13\n\nQ13. How confident are you in the food supply chain? That is all the processes involved in bringing food to your table.Please select one answer only\n\nBase: all respondents; weighted percentages.\n\nResponses: Very confident; Fairly confident; Not very confident; Not at all confident; It varies; Don't know; Net: Confident; Net: Unconfident\n\n## Q14_1\n\nQ14_1. Ensure that food is safe to eat\n\nBase: all respondents; weighted percentages.\n\nResponses: Very confident; Fairly confident; Not very confident; Not at all confident; It varies; Don't know; Net: Confident;   </script>
  <script>
    'use strict';
    const pack = JSON.parse(document.getElementById('data').textContent),
      key = 'velocity-review-' + pack.pack_id;
    const initial = {
      version: 1,
      pack_id: pack.pack_id,
      reviewer: '',
      cases: {},
      candidates: {},
      created_at: new Date().toISOString(),
    };
    let state = initial,
      active = pack.cases[0].study_id,
      selected = null,
      storageError = '';
    try {
      const saved = JSON.parse(localStorage.getItem(key) || 'null');
      if (saved) {
        validateProgress(saved);
        state = saved;
      }
    } catch {
      storageError = 'Browser storage is unavailable. Export progress before closing.';
    }
    const el = (tag, text, cls) => {
      const n = document.createElement(tag);
      if (text !== undefined) n.textContent = text;
      if (cls) n.className = cls;
      return n;
    };
    const persist = () => {
      try {
        localStorage.setItem(key, JSON.stringify(state));
      } catch {
        storageError = 'Browser storage is unavailable. Export progress before closing.';
      }
    };
    const current = () => pack.cases.find((c) => c.study_id === active);
    const review = () =>
      state.cases[active] ||
      (state.cases[active] = { baseline: '', prepared: false, revisedEvidence: null, revision: 0 });
    const candidate = () => current().candidates.find((c) => c.candidate_id === selected);
    const draft = () =>
      state.candidates[selected] ||
      (state.candidates[selected] = {
        findings: {},
        beats: {},
        missed: '',
        minutes: '',
        notes: '',
        approved: false,
        started_at: new Date().toISOString(),
      });
    function notice(text) {
      let n = document.getElementById('notice');
      if (!n) {
        n = el('div');
        n.id = 'notice';
        n.setAttribute('role', 'status');
        document.getElementById('content').prepend(n);
      }
      n.textContent = text;
      n.scrollIntoView({ block: 'nearest' });
    }
    function field(parent, label, value, onchange, tag = 'textarea') {
      const id = 'field-' + Math.random().toString(36).slice(2);
      const l = el('label', label);
      l.htmlFor = id;
      const n = el(tag);
      n.id = id;
      n.value = value || '';
      n.oninput = () => {
        onchange(n.value);
        persist();
      };
      parent.append(l, n);
      return n;
    }
    function box(parent, label, checked, onchange) {
      const l = el('label');
      const n = el('input');
      n.type = 'checkbox';
      n.checked = checked;
      n.onchange = () => {
        onchange(n.checked);
        persist();
      };
      l.append(n, document.createTextNode(label));
      parent.append(l);
      return n;
    }
    function resolve(path, output) {
      const original = path;
      path = path.replace(/^analysis_results\.json\./, '').replace(/^SBT-00[23]:/, '');
      let value = review().revisedEvidence || current().evidence,
        parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
      if (path.startsWith('/analysis_claims/')) {
        value = review().revision === 0 ? output : null;
        parts = path
          .slice(1)
          .split('/')
          .map((x) => x.replace(/~1/g, '/').replace(/~0/g, '~'));
      } else if (path.startsWith('analysis_claims.')) {
        value = review().revision === 0 ? output?.analysis_claims?.find((a) => a.analysis_id === parts[1]) : null;
        parts = parts.slice(2);
      }
      for (const part of parts) {
        value = value && typeof value === 'object' && Object.hasOwn(value, part) ? value[part] : undefined;
      }
      if (value !== undefined && value !== null) return value;
      const claim = review().revision === 0 ? output?.analysis_claims?.find((a) => a.analysis_id === path) : null;
      return (
        claim || {
          unresolved_reference: original,
          note: 'Locate this claim in the supplied analysis tables or refresh raw-data analysis before accepting it.',
        }
      );
    }
    function showEvidence(path, output) {
      document.getElementById('evidence-title').textContent = path;
      document.getElementById('evidence-body').textContent = JSON.stringify(resolve(path, output), null, 2);
      document.getElementById('evidence-dialog').showModal();
    }
    function exportFile(value, name) {
      const url = URL.createObjectURL(new Blob([JSON.stringify(value, null, 2)], { type: 'application/json' }));
      const a = el('a');
      a.href = url;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function invalidate(d) {
      document.getElementById('notice')?.remove();
      d.approved = false;
    }
    function render() {
      const nav = document.getElementById('nav');
      nav.replaceChildren();
      for (const c of pack.cases) {
        const b = el('button', c.study_id);
        b.setAttribute('aria-current', String(c.study_id === active));
        b.onclick = () => {
          active = c.study_id;
          selected = null;
          render();
        };
        nav.append(b);
      }
      const root = document.getElementById('content');
      root.replaceChildren();
      const c = current(),
        r = review();
      root.append(el('div', 'BLINDED REVIEW · ' + c.study_id, 'eyebrow'), el('h2', c.materials.title));
      if (storageError) notice(storageError);
      const prep = el('section');
      prep.append(el('h3', '1. Inspect preparation and form your own view'), el('p', c.materials.decision_question));
      const details = el('details');
      details.append(
        el('summary', 'Brief, methods and questionnaire'),
        el('pre', JSON.stringify(c.materials, null, 2) + '\n\n' + c.questionnaire),
      );
      prep.append(details);
      const tableButton = el('button', 'Inspect all approved tables');
      tableButton.onclick = () => showEvidence('', null);
      prep.append(tableButton);
      tableButton.onclick = () => {
        document.getElementById('evidence-title').textContent = 'Approved analysis';
        document.getElementById('evidence-body').textContent = JSON.stringify(r.revisedEvidence || c.evidence, null, 2);
        document.getElementById('evidence-dialog').showModal();
      };
      field(prep, 'Your important findings and unacceptable claims — before reading candidates', r.baseline, (v) => {
        r.baseline = v;
      });
      box(prep, 'I have checked the preparation, weights, universes and limitations', r.prepared, (v) => {
        r.prepared = v;
        for (const x of c.candidates) {
          if (state.candidates[x.candidate_id]) invalidate(state.candidates[x.candidate_id]);
        }
      });
      const open = el('button', 'Review candidates');
      open.onclick = () => {
        if (r.baseline.trim().length < 10) {
          notice('Record your independent findings first.');
          return;
        }
        selected = c.candidates[0].candidate_id;
        render();
      };
      prep.append(open);
      root.append(prep);
      if (!selected) {
        root.append(
          el(
            'p',
            'Candidate identities and provisional scores are withheld. Record your own view first, then assess each output independently.',
            'muted',
          ),
        );
        return;
      }
      const choose = el('section');
      choose.append(el('h3', '2. Review evidence and findings'));
      const menu = el('select');
      menu.setAttribute('aria-label', 'Candidate');
      for (const x of c.candidates) {
        const o = el('option', x.candidate_id);
        o.value = x.candidate_id;
        menu.append(o);
      }
      menu.value = selected;
      menu.onchange = () => {
        selected = menu.value;
        render();
      };
      choose.append(menu);
      root.append(choose);
      const x = candidate(),
        d = draft();
      for (const f of x.output.findings) {
        const v =
          d.findings[f.model_finding_id] ||
          (d.findings[f.model_finding_id] = {
            decision: 'pending',
            text: f.proposition,
            reason: '',
            importance: f.importance,
          });
        const card = el('section');
        card.append(el('span', f.model_finding_id + ' · proposed ' + f.importance, 'pill'));
        field(card, 'Finding', v.text, (value) => {
          v.text = value;
          invalidate(d);
        });
        card.append(el('p', f.qualification || '', 'muted'));
        const refs = el('div');
        for (const ref of f.evidence_refs) {
          const b = el('button', ref, 'evidence');
          b.onclick = () => showEvidence(ref, x.output);
          refs.append(b);
        }
        card.append(refs);
        const row = el('div', undefined, 'row');
        const decision = el('select');
        decision.setAttribute('aria-label', 'Decision ' + f.model_finding_id);
        for (const value of ['pending', 'accept', 'revise', 'reject']) {
          const o = el('option', value[0].toUpperCase() + value.slice(1));
          o.value = value;
          decision.append(o);
        }
        decision.value = v.decision;
        decision.onchange = () => {
          v.decision = decision.value;
          invalidate(d);
          persist();
        };
        const importance = el('select');
        importance.setAttribute('aria-label', 'Importance ' + f.model_finding_id);
        for (const value of ['primary', 'secondary', 'context']) {
          const o = el('option', value);
          o.value = value;
          importance.append(o);
        }
        importance.value = v.importance;
        importance.onchange = () => {
          v.importance = importance.value;
          invalidate(d);
          persist();
        };
        row.append(decision, importance);
        card.append(row);
        field(card, 'Reason or required correction', v.reason, (value) => {
          v.reason = value;
          invalidate(d);
        });
        root.append(card);
      }
      const story = el('section');
      story.append(el('h3', '3. Approve the narrative'));
      for (const beat of x.output.story.beats) {
        const id = String(beat.order);
        const b = d.beats[id] || (d.beats[id] = { include: true, title: beat.headline_intent, order: beat.order });
        box(story, 'Include beat ' + beat.order + ' · ' + beat.finding_refs.join(', '), b.include, (v) => {
          b.include = v;
          invalidate(d);
        });
        field(
          story,
          'Headline ' + beat.order,
          b.title,
          (v) => {
            b.title = v;
            invalidate(d);
          },
          'input',
        );
        const order = field(
          story,
          'Position ' + beat.order,
          b.order,
          (v) => {
            b.order = Number(v);
            invalidate(d);
          },
          'input',
        );
        order.type = 'number';
        order.min = '1';
        story.append(el('p', beat.analytical_relationship, 'muted'));
      }
      field(story, 'Missed important findings', d.missed, (v) => {
        d.missed = v;
        invalidate(d);
      });
      field(
        story,
        'Active review minutes',
        d.minutes,
        (v) => {
          d.minutes = v;
        },
        'input',
      ).type = 'number';
      field(story, 'Overall judgement and candidate preference (ties allowed)', d.notes, (v) => {
        d.notes = v;
      });
      const approve = el('button', 'Approve narrative and export', 'primary');
      approve.onclick = () => approveNarrative(x, d, r);
      story.append(approve);
      root.append(story);
      const revisions = el('section');
      revisions.append(
        el('h3', 'Evidence revisions'),
        el(
          'p',
          'Load replacement analysis results to review a data update. Every approval is cleared; your edits and reasons are preserved. The replacement must carry this study ID and a source fingerprint.',
        ),
      );
      const upload = el('input');
      upload.type = 'file';
      upload.accept = '.json';
      upload.setAttribute('aria-label', 'Revised analysis');
      upload.onchange = async () => {
        try {
          const next = JSON.parse(await upload.files[0].text());
          if ((next.project_id || next.study_id) !== active || !next.source_sha256)
            throw Error('Wrong study or missing source fingerprint.');
          r.revisedEvidence = next;
          r.revision++;
          r.prepared = false;
          for (const target of c.candidates) {
            const old = state.candidates[target.candidate_id];
            if (old) {
              old.approved = false;
              for (const f of Object.values(old.findings)) f.decision = 'pending';
            }
          }
          persist();
          render();
          notice('Evidence updated. Preparation and every finding need review again. Your edits were preserved.');
        } catch (err) {
          notice('No data changed: ' + err.message);
        }
      };
      revisions.append(upload);
      root.append(
        revisions,
        el(
          'footer',
          'Evaluation prototype · No reviewer assessment is presumed. Progress stays in this browser until exported. This file is not a Velocity workspace/session.',
        ),
      );
    }
    async function approveNarrative(x, d, r) {
      const problems = [];
      if (!r.prepared) problems.push('Review preparation first.');
      for (const f of x.output.findings) {
        const v = d.findings[f.model_finding_id];
        if (!v || v.decision === 'pending') problems.push('Decide ' + f.model_finding_id + '.');
        else if (
          (v.decision !== 'accept' || v.text !== f.proposition || v.importance !== f.importance) &&
          !v.reason.trim()
        )
          problems.push('Give a reason for ' + f.model_finding_id + '.');
      }
      for (const f of x.output.findings) {
        if (
          d.findings[f.model_finding_id]?.decision !== 'reject' &&
          f.evidence_refs.some((ref) => resolve(ref, x.output)?.unresolved_reference)
        )
          problems.push(
            'Resolve the current evidence for ' +
              f.model_finding_id +
              ' before approval. A raw-data draft needs refreshed analysis after a data change.',
          );
      }
      const beats = x.output.story.beats.filter((b) => d.beats[String(b.order)]?.include);
      if (!beats.length) problems.push('Keep at least one story beat.');
      const positions = beats.map((b) => d.beats[String(b.order)].order);
      if (positions.some((n) => !Number.isInteger(n) || n < 1) || new Set(positions).size !== positions.length)
        problems.push('Use unique positive narrative positions.');
      for (const beat of beats) {
        for (const id of beat.finding_refs) {
          if (!['accept', 'revise'].includes(d.findings[id]?.decision))
            problems.push('Beat ' + beat.order + ' uses unaccepted finding ' + id + '.');
        }
      }
      if (problems.length) {
        const unique = [...new Set(problems)];
        notice(
          unique.slice(0, 4).join('\n') +
            (unique.length > 4 ? `\n${unique.length - 4} more items require review.` : ''),
        );
        return;
      }
      d.approved = true;
      d.approved_at = new Date().toISOString();
      persist();
      const evidence = r.revisedEvidence || current().evidence;
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(JSON.stringify(evidence)));
      const analysisFingerprint = Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, '0')).join('');
      const approved = {
        schema_version: 1,
        analysis_sha256: analysisFingerprint,
        kind: 'reviewed_research_prototype',
        study_id: active,
        pack_id: pack.pack_id,
        candidate_id: selected,
        source_sha256: evidence.source_sha256,
        evidence_revision: r.revision,
        approved_at: d.approved_at,
        preparation_review: r,
        findings: x.output.findings
          .filter((f) => d.findings[f.model_finding_id].decision !== 'reject')
          .map((f) => ({
            ...f,
            original_proposition: f.proposition,
            original_importance: f.importance,
            proposition: d.findings[f.model_finding_id].text,
            importance: d.findings[f.model_finding_id].importance,
            review: d.findings[f.model_finding_id],
            evidence: f.evidence_refs.map((ref) => ({ analysis_id: ref, values: resolve(ref, x.output) })),
          })),
        story: {
          beats: beats
            .map((b) => ({
              ...b,
              original_order: b.order,
              original_headline_intent: b.headline_intent,
              order: d.beats[String(b.order)].order,
              headline_intent: d.beats[String(b.order)].title,
            }))
            .sort((a, b) => a.order - b.order),
        },
        review: d,
      };
      exportFile(approved, selected + '-approved-review.json');
      notice('Narrative approved for this evidence revision. Exported evidence and original wording remain attached.');
    }
    function validateProgress(value) {
      const object = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
      if (
        !object(value) ||
        value.pack_id !== pack.pack_id ||
        value.version !== 1 ||
        !object(value.cases) ||
        !object(value.candidates)
      )
        throw Error('This review belongs to another pack or has an invalid format.');
      for (const [id, c] of Object.entries(value.cases)) {
        if (
          !pack.cases.some((x) => x.study_id === id) ||
          !object(c) ||
          typeof c.baseline !== 'string' ||
          typeof c.prepared !== 'boolean' ||
          !Number.isInteger(c.revision)
        )
          throw Error('Invalid study review.');
      }
      for (const [id, c] of Object.entries(value.candidates)) {
        const source = pack.cases.flatMap((x) => x.candidates).find((x) => x.candidate_id === id);
        if (!source || !object(c) || !object(c.findings) || !object(c.beats)) throw Error('Invalid candidate review.');
        for (const [fid, f] of Object.entries(c.findings)) {
          if (
            !source.output.findings.some((x) => x.model_finding_id === fid) ||
            !object(f) ||
            !['pending', 'accept', 'revise', 'reject'].includes(f.decision) ||
            typeof f.text !== 'string' ||
            typeof f.reason !== 'string' ||
            !['primary', 'secondary', 'context'].includes(f.importance)
          )
            throw Error('Invalid finding review.');
        }
        for (const b of Object.values(c.beats)) {
          if (!object(b) || typeof b.include !== 'boolean' || typeof b.title !== 'string' || !Number.isFinite(b.order))
            throw Error('Invalid narrative review.');
        }
      }
    }
    document.getElementById('save').onclick = () => exportFile(state, 'research-review-' + pack.pack_id + '.json');
    document.getElementById('close-dialog').onclick = () => document.getElementById('evidence-dialog').close();
    document.getElementById('import').onchange = async (event) => {
      try {
        const incoming = JSON.parse(await event.target.files[0].text());
        validateProgress(incoming);
        state = incoming;
        persist();
        render();
        notice('Progress restored.');
      } catch (err) {
        notice('No progress changed: ' + err.message);
      }
    };
    render();
  </script>
